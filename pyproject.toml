[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "alpha101_factory"
version = "0.2.0"
description = "可插拔 Alpha101 因子工厂 — A股日线量化研究工具"
requires-python = ">=3.8"
dependencies = [
    "pandas>=1.3.0",
    "numpy>=1.21.0",
    "akshare>=1.13.0",
    "baostock>=0.8.8",
    "pyarrow>=10.0.0",
    "loguru>=0.7.0",
    "tqdm>=4.64.0",
    "plotly>=5.13.0",
    "kaleido>=0.2.1",
]

[project.optional-dependencies]
perf = [
    "bottleneck>=1.3.5",
    "numba>=0.57.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[tool.setuptools.packages.find]
include = ["alpha101_factory*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
